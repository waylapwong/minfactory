@if (isOpen()) {
  <!-- BACKDROP -->
  <div class="fixed inset-0 z-40 flex items-center justify-center bg-black/50 backdrop-blur-xs">
    <!-- DIALOG -->
    <dialog
      open
      aria-modal="true"
      [attr.aria-label]="title()"
      [class]="
        'relative m-0 rounded-lg border-4 border-black bg-gray-100 p-4 text-neutral-900 shadow-xl ' +
        (size() === 'wide'
          ? 'max-h-[90dvh] w-[calc(100%-1rem)] max-w-3xl overflow-y-auto'
          : 'max-h-[90dvh] w-9/10 max-w-md overflow-y-auto')
      "
    >
      <div class="flex flex-row items-start justify-between">
        <!-- TITLE -->
        <min-h2>{{ title() }}</min-h2>
        <!-- CLOSE BUTTON -->
        <min-button [ariaLabel]="'Schließen'" [color]="Color.Gray" (clicked)="emitClosed()">
          <img src="assets/svgs/shared/close.svg" alt="" class="h-4 w-4" />
        </min-button>
      </div>

      <ng-content select="[dialog-subtitle]"></ng-content>

      <!-- CONTENT -->
      <ng-content></ng-content>
    </dialog>
  </div>
}
