<div class="flex w-full flex-col">
  @if (label()) {
    <label class="font-bold" [for]="id()">{{ label() }}:</label>
  }
  <textarea
    [attr.aria-invalid]="isFormControlInvalid() ? 'true' : null"
    [formControl]="formControlInput()"
    [id]="id()"
    [maxlength]="maxLength()"
    [rows]="rows()"
    [class]="
      `w-full rounded-lg border-4 bg-white p-3 shadow-xl transition-all duration-100 hover:bg-gray-100 hover:shadow-xl focus-visible:ring-4 focus-visible:ring-black` +
      ` disabled:cursor-not-allowed disabled:bg-gray-300 disabled:opacity-50 disabled:shadow-none` +
      ` ${isFormControlInvalid() ? 'border-red-500' : 'border-black'}`
    "
    (input)="valueChanged.emit($event)"
  ></textarea>
  @if (showCharacterCount()) {
    <p class="mt-1 text-right text-xs text-gray-600">{{ getCharacterCount() }} / {{ maxLength() }} Zeichen</p>
  }
</div>
