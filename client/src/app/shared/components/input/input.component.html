<div class="flex w-full flex-col">
  <!-- LABEL -->
  @if (label()) {
    <label class="font-bold" [for]="id()"> {{ label() }}: </label>
  }
  <!-- INPUT -->
  <input
    [class]="
      `rounded-lg border-4 bg-white px-2 py-1 shadow-2xl` +
      ` placeholder:text-gray-500` +
      ` transition-all duration-100 hover:bg-gray-100 hover:shadow-xl focus-visible:ring-4 focus-visible:ring-black` +
      ` disabled:cursor-not-allowed disabled:bg-gray-300 disabled:opacity-50 disabled:shadow-none` +
      ` focus:ring-black ${isFormControlInvalid() ? 'border-red-500' : 'border-black'}`
    "
    [attr.autocomplete]="autocomplete()"
    [attr.maxlength]="maxLength()"
    [attr.max]="max()"
    [attr.min]="min()"
    [attr.minlength]="minLength()"
    [formControl]="formControlInput()"
    [attr.aria-invalid]="isFormControlInvalid() ? 'true' : null"
    [id]="id()"
    [placeholder]="placeholder()"
    [type]="type()"
    (input)="valueChanged.emit($event)"
  />
  @if (showCharacterCount()) {
    <p class="mt-1 text-right text-xs text-gray-600">{{ getCharacterCount() }} / {{ maxLength() }} Zeichen</p>
  }
</div>
