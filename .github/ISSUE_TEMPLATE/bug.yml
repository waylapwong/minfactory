name: Bug
description: Bug Ticket
title: "[Bug]"

body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      value: "_____"
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Referenzen
      description: Optionale Links auf relevante Dokumentationen und verwandte Issues.
      value: |
        **Fachliche Dokumentation:**

        **Technische Dokumentation:**

        **Weitere Referenzen:**
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Reproduktionsschritte
      value: |
        - _____
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Erwartetes Verhalten
      value: "_____"
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Tatsächliches Verhalten
      value: "_____"
    validations:
      required: true
